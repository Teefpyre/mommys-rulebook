name = "daily-rulebook"
main = "worker/index.ts"
compatibility_date = "2025-05-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[durable_objects]
bindings = [
  { name = "RULEBOOK_HUB", class_name = "RulebookHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RulebookHub"]
